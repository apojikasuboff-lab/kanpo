<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>医薬品GS1スキャナー</title>
  <!-- ライブラリ読み込み -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 16px;
      text-align: center;
      background-color: #f8fafc;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      min-height: 250px;
    }
    .result-box {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .drug-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #1e293b;
      margin-top: 8px;
    }
    .code-display {
      font-size: 0.85rem;
      color: #64748b;
      word-break: break-all;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .match { background: #dcfce7; color: #166534; }
    .unmatch { background: #fee2e2; color: #991b1b; }
    .btn-start {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h3>医薬品GS1バーコードリーダー</h3>
  <div id="reader"></div>

  <!-- iOSで自動起動がブロックされた場合の再試行ボタン -->
  <button id="startBtn" class="btn-start" style="display: none;" onclick="initCamera()">カメラを起動する</button>

  <div class="result-box">
    <div id="statusBadge" class="status-badge match" style="display: none;"></div>
    <div class="code-display" id="rawCode">カメラを初期化中...</div>
    <div class="drug-name" id="drugName">-</div>
  </div>

  <script>
    const drugMaster = {
      "04987123456789": "アムロジピン錠5mg「トーワ」 100錠",
      "14987123456786": "アムロジピン錠5mg「トーワ」 1000錠",
      "04987000111222": "ロキソプロフェンNa錠60mg「サワイ」 100錠",
      "04987080906971": "クラリスロマイシン錠200mg「日医工」 100錠"
    };

    function extractGTIN(rawText) {
      const match = rawText.match(/(?:\(01\)|^01)?(\d{14})/);
      return match ? match[1] : rawText.trim();
    }

    function onScanSuccess(decodedText, decodedResult) {
      const gtin = extractGTIN(decodedText);
      const matchedName = drugMaster[gtin];

      const rawCodeEl = document.getElementById('rawCode');
      const drugNameEl = document.getElementById('drugName');
      const badgeEl = document.getElementById('statusBadge');

      rawCodeEl.textContent = `読取: ${decodedText} (GTIN: ${gtin})`;
      badgeEl.style.display = 'inline-block';

      if (matchedName) {
        badgeEl.textContent = "照合一致";
        badgeEl.className = "status-badge match";
        drugNameEl.textContent = matchedName;
      } else {
        badgeEl.textContent = "未登録コード";
        badgeEl.className = "status-badge unmatch";
        drugNameEl.textContent = "マスタに該当する医薬品がありません";
      }
    }

    async function initCamera() {
      const rawCodeEl = document.getElementById('rawCode');
      const startBtn = document.getElementById('startBtn');
      rawCodeEl.textContent = "カメラを起動しています...";
      startBtn.style.display = "none";

      try {
        const html5QrCode = new Html5Qrcode("reader");

        // iOSに優しいカメラ設定（facingMode: "environment" のみで起動）
        const cameraConfig = { facingMode: "environment" };

        const config = {
          fps: 15,
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            // 画面サイズに応じた認識枠
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            return {
              width: Math.floor(minEdge * 0.8),
              height: Math.floor(minEdge * 0.5)
            };
          },
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          }
        };

        await html5QrCode.start(
          cameraConfig,
          config,
          onScanSuccess,
          (err) => {} // フレーム毎のエラーはスキップ
        );

        rawCodeEl.textContent = "バーコードを枠内に合わせてください";

      } catch (err) {
        console.error("起動失敗:", err);
        rawCodeEl.textContent = `エラー: ${err?.name || err} (HTTPS環境か確認してください)`;
        startBtn.style.display = "inline-block";
      }
    }

    // 画面ロード時に実行
    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
    });
  </script>
</body>
</html>
