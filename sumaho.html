<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>医薬品GS1コード読取テスト</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- html5-qrcode ライブラリ -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 16px;
      background: #f7f7f7;
    }

    h1 {
      font-size: 20px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 16px auto;
      background: white;
    }

    #result {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1.6;
    }

    .drug-name {
      font-size: 22px;
      font-weight: bold;
      color: #0066cc;
    }

    .code {
      font-family: monospace;
      color: #555;
    }

    button {
      font-size: 16px;
      padding: 10px 16px;
      margin-top: 8px;
    }

    input {
      font-size: 16px;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<h1>医薬品GS1コード読取テスト</h1>

<p>
  カメラでGS1バーコードを読み取ると、登録済みの医薬品名を表示します。
</p>

<div id="reader"></div>

<div id="result">
  読取結果がここに表示されます。
</div>

<hr>

<h2>手入力テスト</h2>
<p>まずはこちらで動作確認できます。</p>

<input id="manualCode" value="(01)04987080906971">
<button onclick="manualTest()">照合する</button>

<script>
  // 医薬品コード一覧
  // キーは GTIN-14、つまり AI(01) の後ろ14桁
  const drugMaster = {
    "04987080906971": "オルメサルタンOD錠20mg「サワイ」"
  };

  function extractGTIN14(rawText) {
    const text = String(rawText).trim();

    // 例: (01)04987080906971
    let m = text.match(/\(01\)\s*(\d{14})/);
    if (m) return m[1];

    // 例: 0104987080906971
    // AI 01 + GTIN14
    const digits = text.replace(/\D/g, "");
    const pos = digits.indexOf("01");
    if (pos !== -1 && digits.length >= pos + 16) {
      return digits.substring(pos + 2, pos + 16);
    }

    // 例: 04987080906971 のみ
    if (/^\d{14}$/.test(digits)) {
      return digits;
    }

    return "";
  }

  function showResult(rawText) {
    const gtin14 = extractGTIN14(rawText);
    const name = drugMaster[gtin14];

    const result = document.getElementById("result");

    if (name) {
      result.innerHTML = `
        <div>読み取りコード：</div>
        <div class="code">${rawText}</div>
        <div>GTIN-14：</div>
        <div class="code">${gtin14}</div>
        <hr>
        <div>医薬品名：</div>
        <div class="drug-name">${name}</div>
      `;
    } else {
      result.innerHTML = `
        <div>読み取りコード：</div>
        <div class="code">${rawText}</div>
        <div>GTIN-14：</div>
        <div class="code">${gtin14 || "抽出できませんでした"}</div>
        <hr>
        <div style="color:red;">登録されていないコードです。</div>
      `;
    }
  }

  function manualTest() {
    const value = document.getElementById("manualCode").value;
    showResult(value);
  }

  function onScanSuccess(decodedText, decodedResult) {
    showResult(decodedText);
  }

  function onScanFailure(error) {
    // 読み取り失敗時は頻繁に呼ばれるため何もしない
  }

  const formats = [
    Html5QrcodeSupportedFormats.RSS_14,
    Html5QrcodeSupportedFormats.RSS_EXPANDED,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.DATA_MATRIX
  ];

  const scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: { width: 300, height: 160 },
      formatsToSupport: formats
    },
    false
  );

  scanner.render(onScanSuccess, onScanFailure);
</script>

</body>
</html>
