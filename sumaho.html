<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医薬品GS1スキャナー</title>
  <!-- GS1-128 / DataMatrix / QR / JAN 対応ライブラリ -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 16px;
      text-align: center;
      background-color: #f8fafc;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .drug-name {
      font-size: 1.25rem;
      font-weight: bold;
      color: #1e293b;
      margin-top: 8px;
    }
    .code-display {
      font-size: 0.85rem;
      color: #64748b;
      word-break: break-all;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .match { background: #dcfce7; color: #166534; }
    .unmatch { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <h3>医薬品GS1バーコードリーダー</h3>
  <div id="reader"></div>

  <div class="result-box">
    <div id="statusBadge" class="status-badge match" style="display: none;"></div>
    <div class="code-display" id="rawCode">バーコードを枠内に合わせてください</div>
    <div class="drug-name" id="drugName">-</div>
  </div>

  <script>
    // --- 医薬品マスター ---
    const drugMaster = {
      "04987123456789": "アムロジピン錠5mg「トーワ」 100錠",
      "14987123456786": "アムロジピン錠5mg「トーワ」 1000錠",
      "04987000111222": "ロキソプロフェンNa錠60mg「サワイ」 100錠",
      "04987080906971": "クラリスロマイシン錠200mg「日医工」 100錠"
    };

    // GS1文字列からGTIN（14桁）を抽出
    function extractGTIN(rawText) {
      const match = rawText.match(/(?:\(01\)|^01)?(\d{14})/);
      return match ? match[1] : rawText.trim();
    }

    // 読み取り成功時の処理
    function onScanSuccess(decodedText, decodedResult) {
      const gtin = extractGTIN(decodedText);
      const matchedName = drugMaster[gtin];

      const rawCodeEl = document.getElementById('rawCode');
      const drugNameEl = document.getElementById('drugName');
      const badgeEl = document.getElementById('statusBadge');

      rawCodeEl.textContent = `読取コード: ${decodedText} (GTIN: ${gtin})`;
      badgeEl.style.display = 'inline-block';

      if (matchedName) {
        badgeEl.textContent = "照合一致";
        badgeEl.className = "status-badge match";
        drugNameEl.textContent = matchedName;
      } else {
        badgeEl.textContent = "未登録コード";
        badgeEl.className = "status-badge unmatch";
        drugNameEl.textContent = "マスタに該当する医薬品がありません";
      }
    }

    // ==========================================
    // ▼ ここからが差し替え・改善した設定部分 ▼
    // ==========================================
    const formatsToSupport = [
      Html5QrcodeSupportedFormats.DATA_MATRIX, // 2次元 GS1
      Html5QrcodeSupportedFormats.CODE_128,    // GS1-128
      Html5QrcodeSupportedFormats.EAN_13       // JANコード
    ];

    const html5QrCode = new Html5Qrcode("reader");

    const config = {
      fps: 15,
      qrbox: { width: 280, height: 180 },
      formatsToSupport: formatsToSupport,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true // 高速ブラウザAPIを使用
      }
    };

    // 高解像度（フルHD）を指定してカメラ起動
    html5QrCode.start(
      {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      config,
      onScanSuccess,
      (errorMessage) => {
        // スキャン試行中の非認識フレームは無視
      }
    ).catch((err) => {
      console.error("カメラ起動エラー:", err);
      document.getElementById('rawCode').textContent = "カメラの起動に失敗しました（HTTPS環境を確認してください）";
    });
  </script>
</body>
</html>
