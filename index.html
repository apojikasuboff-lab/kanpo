<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>品目実績検索</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    margin: 15px; 
    color: #333;
  }
  .search-container {
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #search { 
    width: 320px; 
    padding: 8px 12px; 
    font-size: 15px; 
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #count {
    font-size: 13px;
    color: #666;
  }
  
  /* 表のスクロールコンテナ */
  .table-container { 
    max-height: 82vh; 
    overflow: auto; 
    border: 1px solid #ccc; 
    background: #fff;
  }
  table { 
    border-collapse: separate; 
    border-spacing: 0; 
    font-size: 12px; 
  }
  th, td { 
    border-right: 1px solid #e0e0e0; 
    border-bottom: 1px solid #e0e0e0; 
    padding: 6px 8px; 
    text-align: right; 
    white-space: nowrap;
  }

  /* 1列目（品目名）の固定 */
  th:first-child, td:first-child { 
    text-align: left; 
    position: sticky; 
    left: 0; 
    background: #fdfdfd; 
    z-index: 10; 
    min-width: 220px;
    max-width: 350px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 2px 0 3px -1px rgba(0,0,0,0.1);
  }

  /* 1行目（ヘッダー）の固定 */
  thead th { 
    position: sticky; 
    top: 0; 
    background: #f1f3f5; 
    z-index: 20; 
    font-weight: 600;
  }
  thead th:first-child { 
    z-index: 30; 
    vertical-align: bottom;
    padding-bottom: 8px;
  }

  /* 店舗名ヘッダーの縦書き設定 */
  .store-header {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 1px;
    height: 110px;
    vertical-align: bottom;
    padding: 8px 4px;
    min-width: 28px;
  }

  /* 行のホバー表示 */
  tbody tr:hover td {
    background-color: #f8f9fa;
  }
  tbody tr:hover td:first-child {
    background-color: #edf2f7;
  }
</style>
</head>
<body>

<div class="search-container">
  <input type="text" id="search" placeholder="品目名を入力...">
  <span id="count">読み込み中...</span>
</div>

<div class="table-container">
  <table id="result-table">
    <thead id="tbl-head"></thead>
    <tbody id="tbl-body"></tbody>
  </table>
</div>

<script>
let rawData = [];
let headers = [];
let isComposing = false; // 日本語入力（IME）変換中フラグ

// 全角（英数・記号・カナ・スペース）を半角に変換するマッピング
const kanaMap = {
  'ガ':'ｶﾞ', 'ギ':'ｷﾞ', 'グ':'ｸﾞ', 'ゲ':'ｹﾞ', 'ゴ':'ｺﾞ',
  'ザ':'ｻﾞ', 'ジ':'ｼﾞ', 'ズ':'ｽﾞ', 'ゼ':'ｾﾞ', 'ゾ':'ｿﾞ',
  'ダ':'ﾀﾞ', 'ヂ':'ﾁﾞ', 'ヅ':'ﾂﾞ', 'デ':'ﾃﾞ', 'ド':'ﾄﾞ',
  'バ':'ﾊﾞ', 'ビ':'ﾋﾞ', 'ブ':'ﾌﾞ', 'ベ':'ﾍﾞ', 'ボ':'ﾎﾞ',
  'パ':'ﾊﾟ', 'ピ':'ﾋﾟ', 'プ':'ﾌﾟ', 'ペ':'ﾍﾟ', 'ポ':'ﾎﾟ',
  'ヴ':'ｳﾞ', 'ヷ':'ﾜﾞ', 'ヺ':'ｦﾞ',
  'ア':'ｱ', 'イ':'ｲ', 'ウ':'ｳ', 'エ':'ｴ', 'オ':'ｵ',
  'カ':'ｶ', 'キ':'ｷ', 'ク':'ｸ', 'ケ':'ｹ', 'コ':'ｺ',
  'サ':'ｻ', 'シ':'ｼ', 'ス':'ｽ', 'セ':'ｾ', 'ソ':'ｿ',
  'タ':'ﾀ', 'チ':'ﾁ', 'ツ':'ﾂ', 'テ':'ﾃ', 'ト':'ﾄ',
  'ナ':'ﾅ', 'ニ':'ﾆ', 'ヌ':'ﾇ', 'ネ':'ﾈ', 'ノ':'ﾉ',
  'ハ':'ﾊ', 'ヒ':'ﾋ', 'フ':'ﾌ', 'ヘ':'ﾍ', 'ホ':'ﾎ',
  'マ':'ﾏ', 'ミ':'ﾐ', 'ム':'ﾑ', 'メ':'ﾒ', 'モ':'ﾓ',
  'ヤ':'ﾔ', 'ユ':'ﾕ', 'ヨ':'ﾖ',
  'ラ':'ﾗ', 'リ':'ﾘ', 'ル':'ﾙ', 'レ':'ﾚ', 'ロ':'ﾛ',
  'ワ':'ﾜ', 'ヲ':'ｦ', 'ン':'ﾝ',
  'ァ':'ｧ', 'ィ':'ｨ', 'ゥ':'ｩ', 'ェ':'ｪ', 'ォ':'ｫ',
  'ッ':'ｯ', 'ャ':'ｬ', 'ュ':'ｭ', 'ョ':'ｮ',
  'ー':'ｰ', '・':'･', '「':'｢', '」':'｣', '、':'､', '。':'｡'
};
const kanaRegex = new RegExp('(' + Object.keys(kanaMap).join('|') + ')', 'g');

// 文字列を半角へ一括変換する関数
function toHalfWidth(str) {
  if (!str) return '';
  return str
    // 全角カタカナ -> 半角カタカナ
    .replace(kanaRegex, match => kanaMap[match])
    // 全角英数・記号 -> 半角
    .replace(/[！-～]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
    // 全角スペース -> 半角スペース
    .replace(/ /g, ' ');
}

// data.csv の読み込み
Papa.parse("data.csv", {
  download: true,
  skipEmptyLines: true,
  complete: function(results) {
    if (!results.data || results.data.length === 0) {
      document.getElementById('count').textContent = 'データが見つかりませんでした。';
      return;
    }
    headers = results.data[0];
    rawData = results.data.slice(1);
    
    renderHeader();
    renderRows(rawData.slice(0, 100));
    document.getElementById('count').textContent = `全 ${rawData.length.toLocaleString()} 件（先頭100件を表示中）`;
  },
  error: function(err) {
    document.getElementById('count').textContent = 'CSV読み込みエラー: ' + err.message;
  }
});

function renderHeader() {
  const tr = document.createElement('tr');
  headers.forEach((h, index) => {
    const th = document.createElement('th');
    th.textContent = h;
    if (index > 0) th.classList.add('store-header');
    tr.appendChild(th);
  });
  document.getElementById('tbl-head').appendChild(tr);
}

function renderRows(rows) {
  const tbody = document.getElementById('tbl-body');
  tbody.innerHTML = '';
  const fragment = document.createDocumentFragment();
  rows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(cell => {
      const td = document.createElement('td');
      td.textContent = cell !== undefined ? cell : '';
      tr.appendChild(td);
    });
    fragment.appendChild(tr);
  });
  tbody.appendChild(fragment);
}

// 絞り込み実行関数
function executeFilter(val) {
  const query = toHalfWidth(val).toLowerCase().trim();
  
  if (!query) {
    renderRows(rawData.slice(0, 100));
    document.getElementById('count').textContent = `全 ${rawData.length.toLocaleString()} 件（先頭100件を表示中）`;
    return;
  }
  
  const keywords = query.split(/\s+/);
  const matched = rawData.filter(row => {
    const itemName = toHalfWidth(row[0]).toLowerCase();
    return keywords.every(kw => itemName.includes(kw));
  });

  renderRows(matched.slice(0, 300));
  
  if (matched.length > 300) {
    document.getElementById('count').textContent = `該当 ${matched.length.toLocaleString()} 件（上位300件を表示中）`;
  } else {
    document.getElementById('count').textContent = `該当 ${matched.length.toLocaleString()} 件`;
  }
}

const searchInput = document.getElementById('search');

// IME変換の監視（確定前に入力枠を書き換えると誤作動するため制御）
searchInput.addEventListener('compositionstart', () => { isComposing = true; });
searchInput.addEventListener('compositionend', (e) => {
  isComposing = false;
  // 確定した瞬間に検索ボックスの表示自体を半角化して検索
  const half = toHalfWidth(searchInput.value);
  searchInput.value = half;
  executeFilter(half);
});

// 入力イベント（半角直接入力・コピペ対応）
searchInput.addEventListener('input', (e) => {
  if (isComposing) return;
  const half = toHalfWidth(searchInput.value);
  if (searchInput.value !== half) {
    searchInput.value = half;
  }
  executeFilter(half);
});
</script>
</body>
</html>
